# Construit le site de documentation à chaque modification : un lien cassé ou une page
# invalide fait échouer la CI. (Déploiement sur Vercel : J5.)
name: Docs site

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs-site.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: docs-site

jobs:
  build:
    name: Construire le site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs-site/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Construire
        run: pnpm build
