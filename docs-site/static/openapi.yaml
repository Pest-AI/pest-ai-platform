openapi: 3.0.3
info:
  title: PEST AI OS — API
  version: 0.0.1
  description: |-
    API centrale de PEST AI OS : comptes, organisations, producteurs, parcelles, observations, diagnostics.

    **Authentification** : `Authorization: Bearer <jeton>` (voir `POST /api/v1/auth/token/`).

    **Espace de travail** : les routes d'organisation exigent l'en-tête `X-Workspace: org:<uuid>`.
paths:
  /api/v1/auth/activate/:
    post:
      operationId: auth_activate_create
      description: Numéro de téléphone, code d'activation reçu du gérant et mot de
        passe choisi. Le code est valable 7 jours, à usage unique, annulé après 5
        essais erronés.
      summary: Activer mon compte
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountActivationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountActivationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountActivationRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: 'Compte activé : la personne peut se connecter.'
        '400':
          description: Numéro ou code invalide ou expiré, ou mot de passe trop faible.
        '429':
          description: 'Trop de tentatives : réessayez plus tard.'
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Invalide le jeton `refresh` fourni.
      summary: Se déconnecter
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/token/:
    post:
      operationId: auth_token_create
      description: 'Numéro de téléphone (E.164) et mot de passe. Renvoie `access`
        et `refresh`. Tentatives limitées par numéro : au-delà, réponse 429 avec l''en-tête
        `Retry-After`.'
      summary: Se connecter
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Renvoie un nouveau `access` et un nouveau `refresh` ; l'ancien
        est invalidé.
      summary: Renouveler le jeton d'accès
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/web/logout/:
    post:
      operationId: auth_web_logout_create
      description: 'POST /api/v1/auth/web/logout/ : révoque le jeton du cookie et
        efface le cookie.'
      summary: Se déconnecter (app terrain, navigateur)
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: Session fermée.
        '403':
          description: Origine non autorisée.
  /api/v1/auth/web/refresh/:
    post:
      operationId: auth_web_refresh_create
      description: 'Lit le cookie de session, renvoie un nouveau `access` et remplace
        le cookie (l''ancien jeton est mis sur liste noire). Sans cookie valide :
        401 et cookie effacé.'
      summary: Renouveler le jeton d'accès (app terrain, navigateur)
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAccessToken'
          description: ''
        '401':
          description: Pas de session valide.
        '403':
          description: Origine non autorisée.
  /api/v1/auth/web/token/:
    post:
      operationId: auth_web_token_create
      description: Comme `POST /api/v1/auth/token/`, mais le jeton de renouvellement
        est posé dans un cookie httpOnly et seul `access` est renvoyé. Réservé aux
        origines autorisées.
      summary: Se connecter (app terrain, navigateur)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebLoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WebLoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WebLoginRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAccessToken'
          description: ''
        '401':
          description: Identifiants incorrects.
        '403':
          description: Origine non autorisée.
        '429':
          description: Trop de tentatives pour ce numéro.
  /api/v1/campaigns/:
    get:
      operationId: campaigns_list
      description: 'Campagnes de l''organisation active, ou de l''espace personnel.
        Permission : `campaigns.view` ou `personal.crop_cycles.manage`.'
      summary: Campagnes de l'espace
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: 'Espace de travail dans lequel vous agissez : `org:<uuid-de-l-organisation>`.
          La valeur à utiliser est donnée par `GET /api/v1/me/` (champ `memberships[].workspace`).
          Absent ou mal formé : 400. Pas d''adhésion active : 403.'
        required: true
      - in: query
        name: archived
        schema:
          type: boolean
        description: Inclure les campagnes archivées.
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - in: query
        name: season_type
        schema:
          type: string
        description: rainy, cold_dry, hot_dry, other
      - in: query
        name: status
        schema:
          type: string
        description: planned, active, closed
      - in: query
        name: year
        schema:
          type: integer
      tags:
      - agriculture
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCampaignList'
          description: ''
    post:
      operationId: campaigns_create
      description: 'Saison (D-18) : rainy (hivernage), cold_dry (contre-saison froide),
        hot_dry (contre-saison chaude), other. Nom unique dans l''espace.'
      summary: Créer une campagne
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: 'Espace de travail dans lequel vous agissez : `org:<uuid-de-l-organisation>`.
          La valeur à utiliser est donnée par `GET /api/v1/me/` (champ `memberships[].workspace`).
          Absent ou mal formé : 400. Pas d''adhésion active : 403.'
        required: true
      tags:
      - agriculture
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CampaignWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CampaignWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
  /api/v1/campaigns/{id}/:
    get:
      operationId: campaigns_retrieve
      description: Choisit le jeu de permissions selon l'espace et fournit le contexte
        vérifié.
      summary: Campagne
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: 'Espace de travail dans lequel vous agissez : `org:<uuid-de-l-organisation>`.
          La valeur à utiliser est donnée par `GET /api/v1/me/` (champ `memberships[].workspace`).
          Absent ou mal formé : 400. Pas d''adhésion active : 403.'
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) campagne agricole.
        required: true
      tags:
      - agriculture
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
    patch:
      operationId: campaigns_partial_update
      description: 'Statut : planned → active → closed. Une campagne clôturée ne se
        modifie plus et n''accepte plus de nouveau cycle.'
      summary: Modifier une campagne
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: 'Espace de travail dans lequel vous agissez : `org:<uuid-de-l-organisation>`.
          La valeur à utiliser est donnée par `GET /api/v1/me/` (champ `memberships[].workspace`).
          Absent ou mal formé : 400. Pas d''adhésion active : 403.'
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) campagne agricole.
        required: true
      tags:
      - agriculture
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCampaignUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCampaignUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCampaignUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
  /api/v1/campaigns/{id}/archive/:
    post:
      operationId: campaigns_archive_create
      description: 'Jamais supprimée : archivée avec un motif.'
      summary: Archiver une campagne
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: 'Espace de travail dans lequel vous agissez : `org:<uuid-de-l-organisation>`.
          La valeur à utiliser est donnée par `GET /api/v1/me/` (champ `memberships[].workspace`).
          Absent ou mal formé : 400. Pas d''adhésion active : 403.'
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) campagne agricole.
        required: true
      tags:
      - agriculture
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgricultureArchiveRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgricultureArchiveRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgricultureArchiveRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
  /api/v1/crop-cycles/:
    get:
      operationId: crop_cycles_list
      description: 'Permission : `crop_cycles.view` ou `personal.crop_cycles.manage`.'
      summary: Cycles de culture de l'espace
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: 'Espace de travail dans lequel vous agissez : `org:<uuid-de-l-organisation>`.
          La valeur à utiliser est donnée par `GET /api/v1/me/` (champ `memberships[].workspace`).
          Absent ou mal formé : 400. Pas d''adhésion active : 403.'
        required: true
      - in: query
        name: archived
        schema:
          type: boolean
        description: Inclure les cycles archivés.
      - in: query
        name: campaign
        schema:
          type: string
        description: UUID de campagne.
      - in: query
        name: crop
        schema:
          type: string
        description: Code de culture (confirmée, sinon déclarée).
      - in: query
        name: operator
        schema:
          type: string
        description: UUID du producteur exploitant.
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - in: query
        name: parcel
        schema:
          type: string
        description: UUID de parcelle.
      - in: query
        name: status
        schema:
          type: string
        description: planned, in_progress, harvested, abandoned
      tags:
      - agriculture
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCropCycleList'
          description: ''
    post:
      operationId: crop_cycles_create
      description: Sur une parcelle de l'espace (lien actif, ou accès personnel),
        éventuellement une de ses unités, dans une campagne du même espace. L'exploitant
        par défaut est l'exploitant principal de la parcelle. Un chevauchement avec
        un autre cycle est accepté et signalé dans `overlaps` (D-17).
      summary: Démarrer un cycle de culture
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: 'Espace de travail dans lequel vous agissez : `org:<uuid-de-l-organisation>`.
          La valeur à utiliser est donnée par `GET /api/v1/me/` (champ `memberships[].workspace`).
          Absent ou mal formé : 400. Pas d''adhésion active : 403.'
        required: true
      tags:
      - agriculture
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CropCycleCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CropCycleCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CropCycleCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropCycleDetail'
          description: ''
  /api/v1/crop-cycles/{id}/:
    get:
      operationId: crop_cycles_retrieve
      description: Avec opérations, récoltes et chevauchements signalés (D-17).
      summary: Cycle de culture
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: 'Espace de travail dans lequel vous agissez : `org:<uuid-de-l-organisation>`.
          La valeur à utiliser est donnée par `GET /api/v1/me/` (champ `memberships[].workspace`).
          Absent ou mal formé : 400. Pas d''adhésion active : 403.'
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) cycle de culture.
        required: true
      tags:
      - agriculture
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropCycleDetail'
          description: ''
    patch:
      operationId: crop_cycles_partial_update
      description: Dates, surface, variété, campagne, statut (planned → in_progress
        → harvested ; abandoned tant qu'il n'est pas récolté). La parcelle ne change
        jamais.
      summary: Modifier un cycle
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: 'Espace de travail dans lequel vous agissez : `org:<uuid-de-l-organisation>`.
          La valeur à utiliser est donnée par `GET /api/v1/me/` (champ `memberships[].workspace`).
          Absent ou mal formé : 400. Pas d''adhésion active : 403.'
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) cycle de culture.
        required: true
      tags:
      - agriculture
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCropCycleUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCropCycleUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCropCycleUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropCycleDetail'
          description: ''
  /api/v1/crop-cycles/{id}/archive/:
    post:
      operationId: crop_cycles_archive_create
      description: Un cycle n'est jamais supprimé (garanti en base).
      summary: Archiver un cycle
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: 'Espace de travail dans lequel vous agissez : `org:<uuid-de-l-organisation>`.
          La valeur à utiliser est donnée par `GET /api/v1/me/` (champ `memberships[].workspace`).
          Absent ou mal formé : 400. Pas d''adhésion active : 403.'
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) cycle de culture.
        required: true
      tags:
      - agriculture
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgricultureArchiveRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgricultureArchiveRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgricultureArchiveRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropCycleDetail'
          description: ''
  /api/v1/crop-cycles/{id}/confirm-crop/:
    post:
      operationId: crop_cycles_confirm_crop_create
      description: Culture vérifiée par une personne habilitée (`crop_cycles.confirm`,
        agronome). La culture déclarée reste conservée.
      summary: Confirmer la culture
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: 'Espace de travail dans lequel vous agissez : `org:<uuid-de-l-organisation>`.
          La valeur à utiliser est donnée par `GET /api/v1/me/` (champ `memberships[].workspace`).
          Absent ou mal formé : 400. Pas d''adhésion active : 403.'
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) cycle de culture.
        required: true
      tags:
      - agriculture
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmCropRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmCropRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmCropRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropCycleDetail'
          description: ''
  /api/v1/crop-cycles/{id}/harvests/:
    get:
      operationId: crop_cycles_harvests_list
      description: 'GET : liste. POST : enregistrer une récolte (quantité normalisée
        en kg, unité d''origine facultative, méthode de mesure). POST exige `crop_cycles.manage`.'
      summary: Récoltes d'un cycle
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: 'Espace de travail dans lequel vous agissez : `org:<uuid-de-l-organisation>`.
          La valeur à utiliser est donnée par `GET /api/v1/me/` (champ `memberships[].workspace`).
          Absent ou mal formé : 400. Pas d''adhésion active : 403.'
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) cycle de culture.
        required: true
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - agriculture
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHarvestList'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Harvest'
          description: ''
    post:
      operationId: crop_cycles_harvests_create
      description: 'GET : liste. POST : enregistrer une récolte (quantité normalisée
        en kg, unité d''origine facultative, méthode de mesure). POST exige `crop_cycles.manage`.'
      summary: Récoltes d'un cycle
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: 'Espace de travail dans lequel vous agissez : `org:<uuid-de-l-organisation>`.
          La valeur à utiliser est donnée par `GET /api/v1/me/` (champ `memberships[].workspace`).
          Absent ou mal formé : 400. Pas d''adhésion active : 403.'
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) cycle de culture.
        required: true
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - agriculture
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HarvestCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HarvestCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HarvestCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHarvestList'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Harvest'
          description: ''
  /api/v1/crop-cycles/{id}/operations/:
    get:
      operationId: crop_cycles_operations_list
      description: 'GET : liste. POST : enregistrer une opération (préparation du
        sol, semis, irrigation, fertilisation, traitement…), réalisée ou prévue. POST
        exige `crop_cycles.manage`.'
      summary: Opérations d'un cycle
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: 'Espace de travail dans lequel vous agissez : `org:<uuid-de-l-organisation>`.
          La valeur à utiliser est donnée par `GET /api/v1/me/` (champ `memberships[].workspace`).
          Absent ou mal formé : 400. Pas d''adhésion active : 403.'
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) cycle de culture.
        required: true
      - name: page
