components:
  schemas:
    AccountActivationRequest:
      type: object
      description: Activation d'un compte créé par invitation.
      properties:
        phone_number:
          type: string
          minLength: 1
          maxLength: 32
        code:
          type: string
          minLength: 1
          maxLength: 16
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - code
      - new_password
      - phone_number
    ActionEnum:
      enum:
      - create
      - existing
      type: string
      description: |-
        * `create` - create
        * `existing` - existing
    ActivationCode:
      type: object
      properties:
        activation_code:
          type: string
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - activation_code
      - expires_at
    AgentOrganization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        short_name:
          type: string
          readOnly: true
      required:
      - id
      - name
      - short_name
    AgricultureArchiveRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          description: Motif de l'archivage.
          maxLength: 500
      required:
      - reason
    ArchiveRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 3
      required:
      - reason
    ArrangementTypeEnum:
      enum:
      - owner_operated
      - rental
      - sharecropping
      - loan
      - other
      - unknown
      type: string
      description: |-
        * `owner_operated` - Exploitée par le propriétaire
        * `rental` - Location
        * `sharecropping` - Métayage
        * `loan` - Prêt
        * `other` - Autre
        * `unknown` - Inconnu
    Assignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        relationship_type:
          allOf:
          - $ref: '#/components/schemas/RelationshipTypeEnum'
          readOnly: true
        membership_number:
          type: string
          readOnly: true
          nullable: true
        start_date:
          type: string
          format: date
          readOnly: true
        end_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - end_date
      - id
      - is_active
      - membership_number
      - relationship_type
      - start_date
    AttachProducerRequest:
      type: object
      properties:
        producer_id:
          type: string
          format: uuid
        relationship_type:
          $ref: '#/components/schemas/RelationshipTypeEnum'
        membership_number:
          type: string
          maxLength: 50
        start_date:
          type: string
          format: date
      required:
      - producer_id
    BlankEnum:
      enum:
      - ''
    Campaign:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        season_type:
          allOf:
          - $ref: '#/components/schemas/SeasonTypeEnum'
          readOnly: true
        year:
          type: integer
          readOnly: true
        start_date:
          type: string
          format: date
          readOnly: true
        end_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/CampaignStatusEnum'
          readOnly: true
        cycle_count:
          type: integer
          readOnly: true
          default: 0
        is_archived:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - cycle_count
      - end_date
      - id
      - is_archived
      - name
      - season_type
      - start_date
      - status
      - updated_at
      - year
    CampaignRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    CampaignStatusEnum:
      enum:
      - planned
      - active
      - closed
      type: string
      description: |-
        * `planned` - Prévue
        * `active` - En cours
        * `closed` - Clôturée
    CampaignWriteRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        season_type:
          $ref: '#/components/schemas/SeasonTypeEnum'
        year:
          type: integer
          maximum: 2100
          minimum: 2000
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        status:
          $ref: '#/components/schemas/CampaignStatusEnum'
      required:
      - name
      - season_type
      - start_date
      - year
