      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPlatformOrganizationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPlatformOrganizationRequest'
          multipart/form-data:
