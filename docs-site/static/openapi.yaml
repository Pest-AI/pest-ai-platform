          type: string
          format: uuid
          nullable: true
          description: Exploitant principal (producteur rattaché à l'organisation),
            désigné dès la création.
        arrangement_type:
          allOf:
          - $ref: '#/components/schemas/ArrangementTypeEnum'
          description: |-
            Mode d'exploitation (location, métayage, prêt…) ; avec `operator`.

            * `owner_operated` - Exploitée par le propriétaire
            * `rental` - Location
            * `sharecropping` - Métayage
            * `loan` - Prêt
            * `other` - Autre
            * `unknown` - Inconnu
        ownership:
          allOf:
          - $ref: '#/components/schemas/EnrolmentOwnershipRequest'
          nullable: true
          description: 'Foncier déclaré (statut « déclarée ») : enregistré avec la
            parcelle.'
