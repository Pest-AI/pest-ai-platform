      type: object
      properties:
        geometry:
          nullable: true
          description: 'Contour GeoJSON : Polygon, MultiPolygon ou Feature, coordonnées
            [longitude, latitude] en WGS 84, anneau fermé (le dernier point répète
            le premier).'
        capture_method:
          allOf:
          - $ref: '#/components/schemas/CaptureMethodEnum'
          default: manual_drawing
