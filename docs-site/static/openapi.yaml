          Absent ou mal formé : 400. Pas d''adhésion active : 403.'
        required: true
      - in: query
        name: bbox
        schema:
          type: string
        description: 'Emprise de la carte : `minLon,minLat,maxLon,maxLat` (WGS 84).
          Ex. `-15.1,16.5,-14.8,16.8`. Garde les parcelles dont le contour courant
          la touche.'
