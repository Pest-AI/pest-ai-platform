        name: campaign
        schema:
          type: string
        description: 'UUID d''une campagne : parcelles portant un de ses cycles.'
      - in: query
        name: crop
        schema:
          type: string
        description: 'Code de culture (rice…) : parcelles portant un cycle de cette
          culture (prévu ou en cours ; tout statut si `campaign` est donné).'
      - in: query
        name: producer
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      tags:
      - parcels
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                FeatureCollection:
                  value:
                    type: FeatureCollection
                    truncated: false
                    features:
                    - type: Feature
                      id: 3f2a…
                      geometry:
                        type: MultiPolygon
                        coordinates:
                        - - - - -14.96
                              - 16.65
                            - - -14.9591
                              - 16.65
                            - - -14.9591
                              - 16.6509
                            - - -14.96
                              - 16.6509
                            - - -14.96
                              - 16.65
                      properties:
                        agroid: PAI-SN-7K4M9X2Q
                        local_name: Champ du fleuve
                        status: active
                        area_m2: '9987.42'
                        validation_status: valid
          description: ''
