openapi: 3.0.3
info:
  title: PEST AI OS — API
  version: 0.0.1
  description: |-
    API centrale de PEST AI OS : comptes, organisations, producteurs, parcelles, observations, diagnostics.

    **Authentification** : `Authorization: Bearer <jeton>` (voir `POST /api/v1/auth/token/`).

    **Espace de travail** : les routes d'organisation exigent l'en-tête `X-Workspace: org:<uuid>`.
paths:
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Invalide le jeton `refresh` fourni.
      summary: Se déconnecter
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/token/:
    post:
      operationId: auth_token_create
      description: Numéro de téléphone (E.164) et mot de passe. Renvoie `access` et
        `refresh`.
      summary: Se connecter
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Renvoie un nouveau `access` et un nouveau `refresh` ; l'ancien
        est invalidé.
      summary: Renouveler le jeton d'accès
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/me/:
    get:
      operationId: me_retrieve
      description: |-
        GET /api/v1/me/ : profil de l'utilisateur connecté.
        PATCH /api/v1/me/ : modifier prénom, nom, e-mail, langue.
      summary: Mon profil et mes adhésions
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: me_partial_update
      description: |-
        GET /api/v1/me/ : profil de l'utilisateur connecté.
        PATCH /api/v1/me/ : modifier prénom, nom, e-mail, langue.
      summary: Modifier mon profil
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/me/memberships/{membership_id}/accept/:
    post:
      operationId: me_memberships_accept_create
      description: 'POST /api/v1/me/memberships/<id>/accept/ : l''invité accepte son
        invitation.'
      summary: Accepter une invitation
      parameters:
      - in: path
        name: membership_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyMembership'
          description: ''
  /api/v1/me/password/:
    post:
      operationId: me_password_create
      description: 'POST /api/v1/me/password/ : changer son mot de passe.'
      summary: Changer mon mot de passe
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Mot de passe changé.
  /api/v1/memberships/:
    get:
      operationId: memberships_list
      description: |-
        Membres de l'organisation du contexte.

        Un identifiant d'adhésion d'une autre organisation renvoie 404 : le queryset
        est toujours filtré sur l'organisation vérifiée.
      summary: Membres de l'organisation active
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: 'Espace de travail dans lequel vous agissez : `org:<uuid-de-l-organisation>`.
          La valeur à utiliser est donnée par `GET /api/v1/me/` (champ `memberships[].workspace`).
          Absent ou mal formé : 400. Pas d''adhésion active : 403.'
        required: true
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - memberships
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMembershipList'
          description: ''
    post:
      operationId: memberships_create
      description: |-
        Membres de l'organisation du contexte.

        Un identifiant d'adhésion d'une autre organisation renvoie 404 : le queryset
        est toujours filtré sur l'organisation vérifiée.
      summary: Inviter un membre
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: 'Espace de travail dans lequel vous agissez : `org:<uuid-de-l-organisation>`.
          La valeur à utiliser est donnée par `GET /api/v1/me/` (champ `memberships[].workspace`).
          Absent ou mal formé : 400. Pas d''adhésion active : 403.'
        required: true
      tags:
      - memberships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InviteMemberRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InviteMemberRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
  /api/v1/memberships/{id}/:
    get:
      operationId: memberships_retrieve
      description: |-
        Membres de l'organisation du contexte.

        Un identifiant d'adhésion d'une autre organisation renvoie 404 : le queryset
        est toujours filtré sur l'organisation vérifiée.
      summary: Détail d'une adhésion
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: 'Espace de travail dans lequel vous agissez : `org:<uuid-de-l-organisation>`.
          La valeur à utiliser est donnée par `GET /api/v1/me/` (champ `memberships[].workspace`).
          Absent ou mal formé : 400. Pas d''adhésion active : 403.'
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) adhésion.
        required: true
      tags:
      - memberships
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
  /api/v1/memberships/{id}/reactivate/:
    post:
      operationId: memberships_reactivate_create
      description: |-
