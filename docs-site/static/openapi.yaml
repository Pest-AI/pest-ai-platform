        description: Un(une) Chaîne UUID identifiant ce(cette) adhésion.
        required: true
      tags:
      - memberships
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
  /api/v1/memberships/{id}/revoke/:
