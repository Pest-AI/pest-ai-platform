      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOrganization'
          description: ''
  /api/v1/platform/organizations/{id}/admins/:
    post:
      operationId: platform_organizations_admins_create
      description: Invite un utilisateur comme organization_admin (amorçage d'une
        organisation).
      summary: Désigner un administrateur
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) organisation.
        required: true
      tags:
      - platform
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationAdminRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
  /api/v1/platform/organizations/{id}/archive/:
    post:
      operationId: platform_organizations_archive_create
      description: Gestion des organisations par le Super Admin. Chaque appel est
        journalisé.
      summary: Archiver
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) organisation.
        required: true
      tags:
      - platform
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArchiveRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArchiveRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOrganization'
          description: ''
components:
  schemas:
    ArchiveRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 3
      required:
      - reason
    InviteMemberRequest:
      type: object
      properties:
        phone_number:
          type: string
          minLength: 1
          maxLength: 32
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RolesEnum'
      required:
      - phone_number
    Me:
      type: object
      description: Profil de l'utilisateur connecté. Le numéro de téléphone n'est
        pas modifiable ici.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        phone_number:
          type: string
          readOnly: true
          title: Numéro de téléphone
          description: Identifiant de connexion, format international E.164 (+221…).
        first_name:
          type: string
          title: Prénom
          maxLength: 100
        last_name:
          type: string
          title: Nom
          maxLength: 100
        email:
          nullable: true
          title: E-mail
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        preferred_language:
          allOf:
          - $ref: '#/components/schemas/PreferredLanguageEnum'
          title: Langue préférée
        phone_verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Numéro vérifié le
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: Inscrit le
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/MyMembership'
          readOnly: true
      required:
      - date_joined
      - first_name
      - id
      - last_name
      - memberships
      - phone_number
      - phone_verified_at
    MemberUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        first_name:
          type: string
          readOnly: true
          title: Prénom
        last_name:
          type: string
          readOnly: true
          title: Nom
        phone_number:
          type: string
          readOnly: true
          title: Numéro de téléphone
