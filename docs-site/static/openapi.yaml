        (obligatoire). Au plus 1000 parcelles : si `truncated` vaut true, zoomez.
        Propriétés : id, agroid, local_name, status, area_m2, validation_status. Filtres
        `status`, `producer`, `campaign` et `crop` comme la liste.'
