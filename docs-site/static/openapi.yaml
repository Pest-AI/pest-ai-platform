  /api/v1/organization/:
    get:
      operationId: organization_retrieve
      description: 'GET / PATCH /api/v1/organization/ : l''organisation du contexte.'
      summary: Organisation active
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: 'Espace de travail dans lequel vous agissez : `org:<uuid-de-l-organisation>`.
          La valeur à utiliser est donnée par `GET /api/v1/me/` (champ `memberships[].workspace`).
          Absent ou mal formé : 400. Pas d''adhésion active : 403.'
        required: true
      tags:
      - organization
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
    patch:
      operationId: organization_partial_update
      description: 'GET / PATCH /api/v1/organization/ : l''organisation du contexte.'
      summary: Modifier l'organisation active
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: 'Espace de travail dans lequel vous agissez : `org:<uuid-de-l-organisation>`.
          La valeur à utiliser est donnée par `GET /api/v1/me/` (champ `memberships[].workspace`).
          Absent ou mal formé : 400. Pas d''adhésion active : 403.'
        required: true
      tags:
      - organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationRequest'
          multipart/form-data:
