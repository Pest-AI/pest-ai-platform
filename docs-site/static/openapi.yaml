      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
  /api/v1/organizations/:
    get:
      operationId: organizations_list
      description: |-
        GET /api/v1/organizations/ : organisations où l'utilisateur a une adhésion active
        (sert à choisir l'espace de travail ; aucun en-tête X-Workspace requis).
      summary: Mes organisations (choix de l'espace)
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizationList'
          description: ''
  /api/v1/platform/organizations/:
    get:
      operationId: platform_organizations_list
      description: Gestion des organisations par le Super Admin. Chaque appel est
        journalisé.
      summary: Toutes les organisations
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - platform
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPlatformOrganizationList'
          description: ''
    post:
      operationId: platform_organizations_create
      description: Gestion des organisations par le Super Admin. Chaque appel est
        journalisé.
      summary: Créer une organisation
      tags:
      - platform
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformOrganizationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlatformOrganizationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlatformOrganizationRequest'
        required: true
      security:
